name: Windows build and core regression tests
on:
  push:
    paths-ignore: ['downloads/**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/DiskLens.Core.Tests -c Release
      - run: dotnet build src/DiskLens.App -c Release
      - shell: pwsh
        run: ./scripts/build.ps1
      - name: Launch published WPF window
        shell: pwsh
        run: ./scripts/test-startup.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DiskLens-win-x64
          path: artifacts/win-x64/
      - name: Update portable download after startup verification
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath downloads/DiskLens-win-x64.zip -Force
          $hash = (Get-FileHash downloads/DiskLens-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  DiskLens-win-x64.zip" | Set-Content downloads/DiskLens-win-x64.zip.sha256 -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/DiskLens-win-x64.zip downloads/DiskLens-win-x64.zip.sha256
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Update Windows portable package after successful startup test'
          if ($LASTEXITCODE -ne 0) { throw 'Package commit failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Package push failed' }
