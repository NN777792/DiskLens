name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update
        required: true
        default: v1.1.2

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish compact Windows executable
        shell: pwsh
        run: >-
          dotnet publish .\src\DiskCleanerAssistant\DiskCleanerAssistant.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o .\publish\DiskLens-win-x64

      - name: Test application startup
        shell: pwsh
        run: |
          $process = Start-Process .\publish\DiskLens-win-x64\DiskLens.exe -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            $logDirectory = Join-Path $env:LOCALAPPDATA "DiskLens\logs"
            if (Test-Path $logDirectory) {
              Get-ChildItem $logDirectory -File | ForEach-Object {
                Write-Host "--- $($_.Name) ---"
                Get-Content $_.FullName
              }
            }
            throw "DiskLens exited during startup test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Create portable archive
        shell: pwsh
        run: |
          Remove-Item .\publish\DiskLens-win-x64\*.pdb -ErrorAction SilentlyContinue
          Copy-Item .\docs\PORTABLE-README.txt .\publish\DiskLens-win-x64\README.txt
          New-Item -ItemType Directory -Path .\artifacts -Force | Out-Null
          Compress-Archive -Path .\publish\DiskLens-win-x64 -DestinationPath .\artifacts\DiskLens-win-x64.zip -CompressionLevel Optimal

      - name: Upload portable archive to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" .\artifacts\DiskLens-win-x64.zip --clobber
